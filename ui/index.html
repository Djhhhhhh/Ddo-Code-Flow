<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ddo-swe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">ddo-swe</h1>
    <div class="topbar__path" id="topbarPath"></div>
    <div class="topbar__actions">
      <button class="btn btn-secondary" id="openFolderBtn" type="button">Open folder</button>
      <button class="btn btn-secondary" id="reloadBtn" type="button" disabled>Reload</button>
      <button class="btn btn-primary" id="saveBtn" type="button" disabled>Save</button>
    </div>
  </header>

  <div class="banner-host" id="bannerHost" role="status" aria-live="polite"></div>

  <nav class="tabs" role="tablist">
    <button class="tab-pill is-active" role="tab" data-tab="base" aria-selected="true">Base</button>
    <button class="tab-pill" role="tab" data-tab="pipeline" aria-selected="false">Pipeline</button>
    <button class="tab-pill" role="tab" data-tab="atom-tasks" aria-selected="false">Atom-tasks</button>
  </nav>

  <main class="content">
    <section class="tab-panel is-active" data-panel="base">
      <div class="tab-empty" id="baseTabPlaceholder">Open a skill folder to edit base config.</div>
      <div class="form" id="baseForm" hidden></div>
    </section>

    <section class="tab-panel" data-panel="pipeline">
      <div class="tab-empty" id="pipelineTabPlaceholder">Open a skill folder to view the pipeline.</div>
      <div class="pipeline" id="pipelineHost" hidden>
        <div class="pipeline__toolbar">
          <button class="btn btn-secondary" id="toggleParallelApproveBtn" type="button" disabled>
            Toggle parallel-approve on selected
          </button>
          <span class="hint" id="pipelineHint"></span>
        </div>
        <div class="pipeline__canvas" id="pipelineCanvas">
          <svg class="pipeline__edges" id="pipelineEdges" aria-hidden="true">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
              </marker>
            </defs>
          </svg>
          <div class="pipeline__lanes" id="pipelineLanes"></div>
        </div>
        <aside class="pipeline__drawer" id="pipelineDrawer">
          <h2 class="pipeline__drawer-title">Available atom-tasks</h2>
          <div class="pipeline__drawer-list" id="pipelineDrawerList"></div>
        </aside>
      </div>
    </section>

    <section class="tab-panel" data-panel="atom-tasks">
      <div class="tab-empty" id="atomsTabPlaceholder">Open a skill folder to scan atom-tasks.</div>
      <div class="atoms" id="atomsHost" hidden>
        <div class="atoms__toolbar">
          <button class="btn btn-secondary" id="scanBtn" type="button">Scan atom-tasks/</button>
          <span class="hint" id="atomsHint"></span>
        </div>
        <div class="atoms__grid" id="atomsGrid"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
