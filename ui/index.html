<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ddo-Code-Flow Skill Configuration Studio</title>

  <link rel="stylesheet" href="styles.css" />

</head>

<body>

  <header class="topbar">

    <div>

      <h1 class="topbar__title">Ddo-Code-Flow Studio</h1>

      <div class="topbar__subtitle" data-i18n="subtitle">Ddo-Code-Flow Workflow Configuration</div>

    </div>

    <div class="topbar__path" id="topbarPath" data-i18n="noFolder">No skill folder opened</div>

    <div class="topbar__actions">

      <button class="btn btn-secondary" id="languageToggleBtn" type="button">中文</button>

      <button class="btn btn-secondary" id="openFolderBtn" type="button" data-i18n="openFolder">Open folder</button>

      <button class="btn btn-secondary" id="reloadBtn" type="button" disabled data-i18n="reload">Reload</button>

      <button class="btn btn-primary" id="saveBtn" type="button" disabled data-i18n="save">Save</button>

    </div>

  </header>



  <div class="banner-host" id="bannerHost" role="status" aria-live="polite"></div>



  <main class="studio">

    <aside class="registry panel">

      <div class="panel__head">

        <div>

          <div class="eyebrow" data-i18n="atomRegistry">Atom Task Registry</div>

          <h2 data-i18n="capabilities">Capabilities</h2>

        </div>

      </div>

      <div class="registry__toolbar">

        <input class="search" id="taskSearch" type="text" role="search" autocomplete="off" spellcheck="false" placeholder="Search atom-task..." data-i18n-placeholder="searchAtomTask" />

        <button class="btn btn-secondary registry__scan" id="scanBtn" type="button" data-i18n="scan">Scan</button>

      </div>

      <div class="registry__hint" id="atomsHint"></div>

      <div class="task-list" id="taskList"></div>

    </aside>



    <section class="topology panel">

      <div class="panel__head">

        <div>

          <div class="eyebrow" data-i18n="workflowTopology">Workflow Topology</div>

          <h2 data-i18n="pipelineDag">Pipeline DAG</h2>

        </div>

        <div class="toolbar">

          <select class="select workflow-select" id="workflowSelect"></select>

          <button class="target-dir-btn" id="metricsBtn" type="button" disabled>

            <span class="target-dir-btn__label" data-i18n="metricsLabel">Run metrics</span>

            <span class="target-dir-btn__value" id="metricsValue">—</span>

          </button>

        </div>

      </div>

      <div class="canvas" id="workflowCanvas">

        <svg class="edges" id="workflowEdges" aria-hidden="true"></svg>

        <div class="stage-track" id="stageTrack"></div>

      </div>

      <div class="statusline" id="pipelineHint"></div>

    </section>



    <aside class="inspector panel">

      <div class="panel__head">

        <div>

          <div class="eyebrow" data-i18n="inspector">Inspector</div>

          <h2 id="inspectorTitle">Nothing selected</h2>

        </div>

      </div>

      <div class="inspector__body" id="inspectorBody">

        <div class="empty-state" data-i18n="emptyInspector">Select a workflow stage, injected atom-task, or registry item to configure it.</div>

      </div>

    </aside>

  </main>






  <div class="modal-backdrop" id="metricsModalBackdrop" hidden>

    <div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="metricsModalTitle">

      <div class="modal__head">

        <h3 id="metricsModalTitle" data-i18n="metricsModalTitle">Run metrics &amp; cost estimate</h3>

      </div>

      <div class="modal__body" id="metricsModalBody"></div>

      <div class="modal__foot">

        <button class="btn btn-secondary" id="metricsCancelBtn" type="button" data-i18n="cancel">Cancel</button>

        <button class="btn btn-primary" id="metricsConfirmBtn" type="button" data-i18n="confirm">Confirm</button>

      </div>

    </div>

  </div>



  <div class="modal-backdrop" id="atomConfigModalBackdrop" hidden>

    <div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="atomConfigModalTitle">

      <div class="modal__head">

        <h3 id="atomConfigModalTitle"></h3>

      </div>

      <div class="modal__body" id="atomConfigModalBody"></div>

      <div class="modal__foot">

        <button class="btn btn-secondary" id="atomConfigCancelBtn" type="button" data-i18n="cancel">Cancel</button>

        <button class="btn btn-primary" id="atomConfigConfirmBtn" type="button" data-i18n="confirm">Confirm</button>

      </div>

    </div>

  </div>



  <script src="studio.js"></script>

</body>

</html>
